name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Susun proyek
        run: |
          mkdir -p src/main/java/com/klonmc
          mv -f AndroidLauncher.java Main.java World.java Chunk.java src/main/java/com/klonmc/
          mv -f AndroidManifest.xml src/main/AndroidManifest.xml
          echo "rootProject.name = 'KlonMC'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g" >> gradle.properties
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KlonMC-APK
          path: build/outputs/apk/debug/*.apk
